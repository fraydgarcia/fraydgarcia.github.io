---
layout: default
---
<article class="article">

  <header class="article-header">
    <h1>{{ page.title }}</h1>
    <div class="article-meta">
      {{ page.date | date: "%-d.%m.%Y" }}{% if page.reading %} · {{ page.reading }}{% endif %}
    </div>
    {% if page.lead %}<p class="article-lead">{{ page.lead }}</p>{% endif %}
  </header>

  <div class="rule"></div>

  <div class="article-body">
    {{ content }}
  </div>

  <nav class="article-nav">
    <a href="{{ '/research/' | relative_url }}">Toda la investigación</a>
  </nav>

  <footer>
    <a href="{{ '/' | relative_url }}">Inicio</a>
  </footer>

</article>
