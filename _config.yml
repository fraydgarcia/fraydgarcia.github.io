title: "Fray García"
description: "Offensive Security junior con base en Systems Administration. Penetration Testing, Active Directory, seguridad web, writeups de Hack The Box y ruta CPTS desde Lanzarote."
author: "Fray García"
url: "https://fraydgarcia.github.io"
lang: es

# Los artículos viven en /research/<slug>/
permalink: /research/:title/

# Los writeups viven en /writeups/<slug>/
collections:
  writeups:
    output: true
    permalink: /writeups/:name/

# Formato de fecha en español, resuelto en las plantillas
date_format: "%-d de %B de %Y"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

exclude:
  - README.md
  - _posts/_PLANTILLA.md.txt

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "research"
  - scope:
      path: ""
      type: "writeups"
    values:
      layout: "writeup"
