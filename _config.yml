title: "Fray García"
description: "Cloud security y blue team desde una base ofensiva. Administrador de sistemas en Lanzarote. Ingeniería de detección, seguridad en AWS e investigación técnica propia."
author: "Fray García"
url: "https://fraydgarcia.github.io"
lang: es

# Los artículos viven en /research/<slug>/
permalink: /research/:title/

# Formato de fecha en español, resuelto en las plantillas
date_format: "%-d de %B de %Y"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

exclude:
  - README.md
  - _posts/_PLANTILLA.md.txt

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "research"
